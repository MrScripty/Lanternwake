[preset.0]

name="Linux Desktop"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="Content/*.json,Assets/Music/catalog.json,Assets/Music/manifest.json,Assets/Music/*LICENSE.txt,Assets/Music/Source/*.mid,Assets/Music/Source/*.sf2,Assets/Music/Source/*.json,Assets/Music/Source/*LICENSE.txt"
exclude_filter="Assets/Audio/watch_theme.wav,Assets/Audio/watch_theme.wav.import,Assets/Music/*.wav,Assets/Music/*.wav.import,integration/*,tests/*,scripts/*,docs/*,addons/*,qualification/*,ThirdParty/*"
export_path=".toolchain/export/Lanternwake.x86_64"
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
dotnet/include_scripts_content=false
dotnet/include_debug_symbols=false
dotnet/embed_build_outputs=false
