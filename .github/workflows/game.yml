name: Godot C# game checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      LANTERNWAKE_PUMAS_MODEL: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact source identity
        env:
          EXPECTED_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
          printf 'commit %s\n' "$(git rev-parse HEAD)"
          git cat-file commit HEAD | sed -n '1,/^$/p'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.425'
      - name: Provision pinned official Godot .NET
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/godot.zip"
          curl --fail --location --retry 2 --max-time 180 'https://github.com/godotengine/godot/releases/download/4.6.3-stable/Godot_v4.6.3-stable_mono_linux_x86_64.zip' -o "$archive"
          echo "702a8a6785060203fd46373adf864586ecf0c377ac685d7107dde66b1eba0a9e  $archive" | sha256sum --check
          unzip -q "$archive" -d "$RUNNER_TEMP/godot"
          root="$RUNNER_TEMP/godot/Godot_v4.6.3-stable_mono_linux_x86_64"
          echo "GODOT_MONO=$root/Godot_v4.6.3-stable_mono_linux.x86_64" >> "$GITHUB_ENV"
          printf '<configuration><packageSources><clear/><add key="official-godot" value="%s/GodotSharp/Tools/nupkgs"/></packageSources></configuration>\n' "$root" > "$RUNNER_TEMP/Godot.NuGet.Config"
          dotnet restore Lanternwake.sln --configfile "$RUNNER_TEMP/Godot.NuGet.Config"
      - name: Prepare and launch from source with missing audio and an empty local package cache
        run: |
          test ! -f Assets/Audio/harbor.wav
          test ! -d .godot/source-launch
          python3 scripts/run.py -- --headless -- --audio-smoke
          python3 scripts/run.py --setup-only
      - name: Verify canonical story metrics
        run: |
          python3 scripts/story_metrics.py
          git diff --exit-code -- docs/bible/content_metrics.json
      - name: Core, protocol, native build and Godot workflow tests
        run: bash scripts/verify.sh
      - name: Build all Godot solution configurations
        shell: bash
        run: |
          set -euo pipefail
          for configuration in Debug ExportDebug ExportRelease; do
            dotnet build Lanternwake.sln --configuration "$configuration" --no-restore --warnaserror
          done
      - name: Verify official Editor solution build
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/godot-build-solutions.log"
          "$GODOT_MONO" --headless --editor --path . --build-solutions --quit 2>&1 | tee "$log"
          if grep -Eq '(^|[[:space:]])(ERROR:|SCRIPT ERROR:|WARNING:|error [A-Z]+[0-9]+:|warning [A-Z]+[0-9]+:)|Build FAILED|Failed to build' "$log"; then
            echo 'Official Editor solution build emitted a warning or error.' >&2
            exit 1
          fi
      - name: Optional adapter protocol tests
        run: python3 -m unittest discover -s integration/pumas -v
